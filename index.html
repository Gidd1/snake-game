<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Snake</h1>
    <div class="scores">
      <span>Score <b id="score">0</b></span>
      <span>Best <b id="best">0</b></span>
    </div>
  </header>

  <div class="board">
    <canvas id="canvas" width="400" height="400" aria-label="Snake game board"></canvas>
    <div id="overlay">
      <p id="message">Press Space or tap Start</p>
      <button id="start">Start</button>
    </div>
  </div>

  <div class="pad" aria-label="Direction controls">
    <button data-dir="up" aria-label="Up">▲</button>
    <button data-dir="left" aria-label="Left">◀</button>
    <button data-dir="down" aria-label="Down">▼</button>
    <button data-dir="right" aria-label="Right">▶</button>
  </div>
  <p class="hint">Arrow keys or WASD to steer. Space to pause. Swipe on the board on a phone.</p>
</main>
<script src="game.js"></script>
</body>
</html>
